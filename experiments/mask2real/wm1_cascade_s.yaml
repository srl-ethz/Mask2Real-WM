# WM1 of Cascade-S: segmentation-mask world model sim-midtrained from SVD weights.
# Released checkpoint: checkpoints/wm1_cascade_s (step 55,000). It is also the base
# that wm1_cascade_sr.yaml LoRA-finetunes on real data.
# Original config: experiments/real_world_big_data/real_world_big_data_wm1_with_svd_sim_midtraining.yaml
# Actions are normalized with this dataset's own (simulation) stat.json; pass the same
# file via --wm1_dataset_stat_path when running inference with this model.
experiment:
  experiment_name: "wm1_cascade_s"
  experiment_description: "WM1 (Cascade-S): sim midtraining of the segmentation-mask world model from SVD weights on SIM_PRETRAINING_DATA_ALL (5 fps). No ControlNet, no LoRA; dual action conditioning, bf16, 2 views."
  base_config: "../base_configs/base_config_hand_object_wm.yaml"

training:
  tag: "wm1_cascade_s"
  output_dir: "model_ckpt/${training.tag}"
  wandb_run_name: "${experiment.experiment_name}_${training.tag}"
  wandb_project_name: "mask2real-wm"

  debug: false
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 3000
  lr_num_cycles: 0.5
  starting_global_step: 0
  gradient_accumulation_steps: 3
  mixed_precision: "bf16"
  train_batch_size: 24
  shuffle: true
  num_train_epochs: 100
  max_train_steps: 100000
  checkpointing_steps: 5000
  validation_steps: 2500
  validation_batch_size: 4
  max_grad_norm: 1.0
  video_num: 4

dataset:
  # The simulation pretraining data is not part of the public release.
  dataset_root_path: "datasets/2026-05-19T03-28-53"
  dataset_names: "SIM_PRETRAINING_DATA_ALL_lerobot_5fps"
  dataset_meta_info_path: "dataset_meta_info/2026-05-19T03-28-53"
  dataset_cfgs: ${dataset.dataset_names}
  fps: 5
  latent_original_fps: 5
  original_fps: 5
  down_sample: 1
  max_num_samples: 1000000000000000000
  max_num_samples_for_validation: 500
  real_data: true
  num_workers: 8
  swap_abd_with_mcp: true

model:
  load_ctrl_world_pretrained: false
  ckpt_path: null

  use_controlnet_conditioning: false
  use_unet_lora: false

  action_encoder: "action_encoder_dual"
  action_dim: 23
  relative_pose_dims: 6
  cond_dropout_mask_only_prob: 0.10
  cond_dropout_action_only_prob: 0.10
  cond_dropout_both_prob: 0.05
  guidance_scale: 1.0

  num_views: 2
  width: 240
  height: 135
