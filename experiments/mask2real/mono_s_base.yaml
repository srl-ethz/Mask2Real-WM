# Stage 1 of Mono-SR: the monolithic model sim-midtrained from SVD weights on the RGB
# simulation dataset. Released checkpoint: checkpoints/mono_s_base (step 55,000), the base
# that mono_sr.yaml LoRA-finetunes on real data.
# Original config: experiments/real_world_big_data/baseline_ctrl_world_with_svd_sim_midtraining.yaml
experiment:
  experiment_name: "mono_s_base"
  experiment_description: "Mono-SR stage 1: monolithic model sim-midtrained with the same data volume and recipe as WM1's sim midtraining (wm1_cascade_s.yaml), but predicting RGB instead of segmentation masks. Full finetune from SVD weights, no ControlNet, no LoRA, dual action conditioning, bf16, 2 views."
  base_config: "../base_configs/baseline_ctrl.yaml"

training:
  tag: "mono_s_base"
  output_dir: "model_ckpt/${training.tag}"
  wandb_run_name: "${experiment.experiment_name}_${training.tag}"
  wandb_project_name: "mask2real-wm"

  debug: false
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 3000
  lr_num_cycles: 0.5
  starting_global_step: 0
  gradient_accumulation_steps: 3
  mixed_precision: "bf16"
  train_batch_size: 24
  shuffle: true
  num_train_epochs: 100
  # The released checkpoint is step 55,000, matching WM1's sim-midtraining checkpoint;
  # max_train_steps is only a cap.
  max_train_steps: 100000
  checkpointing_steps: 5000
  validation_steps: 2500
  validation_batch_size: 4
  max_grad_norm: 1.0
  video_num: 4

dataset:
  # RGB counterpart of WM1's sim-midtraining data: an independently generated batch of the
  # same size (episode IDs do not align 1:1 with SIM_PRETRAINING_DATA_ALL_lerobot_5fps), with
  # a split matched by sample count. The simulation data is not part of the public release.
  dataset_root_path: "datasets/2026-09-03T19-36-55"
  dataset_names: "sim_data_rgb_5fps"
  dataset_meta_info_path: "dataset_meta_info/2026-09-03T19-36-55"
  dataset_cfgs: ${dataset.dataset_names}
  fps: 5
  latent_original_fps: 5
  original_fps: 5
  down_sample: 1
  max_num_samples: 1000000000000000000
  max_num_samples_for_validation: 500
  real_data: true
  num_workers: 8
  swap_abd_with_mcp: true  # same action-space convention as WM1

model:
  load_ctrl_world_pretrained: false
  ckpt_path: null

  use_controlnet_conditioning: false
  use_unet_lora: false

  action_encoder: "action_encoder_dual"
  action_dim: 23
  relative_pose_dims: 6
  cond_dropout_mask_only_prob: 0.10
  cond_dropout_action_only_prob: 0.10
  cond_dropout_both_prob: 0.05
  guidance_scale: 1.0

  num_views: 2
  width: 240
  height: 135
