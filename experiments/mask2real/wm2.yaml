# WM2: RGB world model conditioned on a segmentation-mask video through a ControlNet branch
# (UNet trained through LoRA adapters). One WM2 is shared by Cascade-R, Cascade-S and
# Cascade-SR. Released checkpoint: checkpoints/wm2 (step 70,000).
# Original config: experiments/real_world_big_data/real_world_big_data_wm2_with_svd.yaml
#
# Action normalization: the original run normalized actions with the simulation statistics
# (dataset_meta_info/2026-05-19T03-28-53/SIM_PRETRAINING_DATA_ALL_lerobot_5fps/stat.json).
# Pass that file via --dataset_stat_path when training and via --wm2_dataset_stat_path at
# inference.
experiment:
  experiment_name: "wm2"
  experiment_description: "WM2: predicts future RGB latents conditioned on a segmentation-mask video (ControlNet on VAE-decoded masks, trained fully) and actions; UNet trained via LoRA (rank 16) from SVD weights on the real-world dataset. 2 views, conditioning dropout between the action and mask streams."
  base_config: "../base_configs/base_video_model_conditioned_on_seg.yaml"

training:
  tag: "wm2"
  output_dir: "model_ckpt/${training.tag}"
  wandb_run_name: "${experiment.experiment_name}_${training.tag}"
  wandb_project_name: "mask2real-wm"

  debug: false
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 3000
  lr_num_cycles: 0.5  # the cosine schedule reaches its minimum at 100,000 steps
  gradient_accumulation_steps: 1
  mixed_precision: "bf16"
  train_batch_size: 8
  shuffle: true
  num_train_epochs: 100
  max_train_steps: 100000
  checkpointing_steps: 5000
  validation_steps: 2500
  max_grad_norm: 1.0
  video_num: 4
  # The original run was resumed at step 5,000 from its own checkpoint
  # (ckpt_path + starting_global_step: 5000); a fresh run starts at 0.
  starting_global_step: 0

dataset:
  dataset_root_path: "datasets/2026-03-14T13-34-49"
  dataset_names: "large_real_dataset_5fps_135_240"
  dataset_meta_info_path: "dataset_meta_info/2026-03-14T13-34-49"
  dataset_cfgs: ${dataset.dataset_names}
  fps: 5
  latent_original_fps: 5
  original_fps: 5
  down_sample: 1
  max_num_samples: 1000000000000000000
  max_num_samples_for_validation: 100
  real_data: true
  swap_abd_with_mcp: true

model:
  load_ctrl_world_pretrained: false
  ckpt_path: null

  action_encoder: "action_encoder_dual"
  cond_dropout_mask_only_prob: 0.10
  cond_dropout_action_only_prob: 0.10
  cond_dropout_both_prob: 0.05
  guidance_scale: 1.0

  use_controlnet_conditioning: true
  controlnet_conditioning_scale: 1.0
  use_vae_roundtrip_for_controlnet: true  # decode pre-encoded latent_segmentation_videos to pixel space before the CNN adapter

  use_unet_lora: true
  unet_lora_rank: 16
  unet_lora_alpha: 16.0

  num_inference_steps: 20

  num_views: 2
  width: 240
  height: 135
