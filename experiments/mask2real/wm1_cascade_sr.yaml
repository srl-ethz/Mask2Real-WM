# WM1 of Cascade-SR: the sim-midtrained WM1 (wm1_cascade_s.yaml, step 55,000) LoRA-finetuned
# on real data. Released checkpoint: checkpoints/wm1_cascade_sr (step 45,000), a single
# self-contained file that already includes the LoRA adapters.
# Original config: experiments/real_world_big_data/real_world_big_data_wm1_with_svd_finetuning_resumed_from_sim_midtrained.yaml
#
# Action normalization: the original run normalized actions with the simulation statistics
# (dataset_meta_info/2026-05-19T03-28-53/SIM_PRETRAINING_DATA_ALL_lerobot_5fps/stat.json).
# Pass that file via --dataset_stat_path when training and via --wm1_dataset_stat_path at
# inference.
experiment:
  experiment_name: "wm1_cascade_sr"
  experiment_description: "WM1 (Cascade-SR): LoRA finetune (rank 16) of the sim-midtrained WM1 on the real-world dataset (episode 215 excluded). No ControlNet; dual action conditioning, bf16, 2 views."
  base_config: "../base_configs/base_config_hand_object_wm.yaml"

training:
  tag: "wm1_cascade_sr"
  output_dir: "model_ckpt/${training.tag}"
  wandb_run_name: "${experiment.experiment_name}_${training.tag}"
  wandb_project_name: "mask2real-wm"

  debug: false
  learning_rate: 5e-6
  lr_scheduler: "cosine"
  lr_warmup_steps: 500
  lr_num_cycles: 0.5
  # The original run was interrupted and resumed from its own step-26,500 checkpoint
  # (starting_global_step: 26500 + finetune_lora_ckpt_path); a fresh run starts at 0.
  starting_global_step: 0
  gradient_accumulation_steps: 2
  mixed_precision: "bf16"
  train_batch_size: 8
  shuffle: true
  num_train_epochs: 100
  max_train_steps: 100000
  checkpointing_steps: 500
  validation_steps: 100
  validation_batch_size: 4
  max_grad_norm: 1.0
  video_num: 4

dataset:
  dataset_root_path: "datasets/2026-03-14T13-34-49"
  dataset_names: "large_real_dataset_5fps_135_240"
  dataset_meta_info_path: "dataset_meta_info/2026-03-14T13-34-49"
  dataset_cfgs: ${dataset.dataset_names}
  exclude_episode_ids_by_dataset:
    large_real_dataset_5fps_135_240: [215]
  fps: 5
  latent_original_fps: 5
  original_fps: 5
  down_sample: 1
  max_num_samples: 1000000000000000000
  max_num_samples_for_validation: 100
  real_data: true
  swap_abd_with_mcp: true
  num_workers: 8

model:
  # Training starts from the sim-midtrained WM1 and attaches fresh LoRA adapters.
  load_ctrl_world_pretrained: false
  ckpt_path: "checkpoints/wm1_cascade_s/model.safetensors"
  finetune_from_checkpoint_before_lora: true
  finetune_lora_ckpt_path: null  # only needed to resume an interrupted run of this stage

  use_controlnet_conditioning: false
  use_unet_lora: True
  unet_lora_rank: 16
  unet_lora_alpha: 16.0

  action_encoder: "action_encoder_dual"
  action_dim: 23
  relative_pose_dims: 6
  cond_dropout_mask_only_prob: 0.10
  cond_dropout_action_only_prob: 0.10
  cond_dropout_both_prob: 0.05
  guidance_scale: 1.0

  num_views: 2
  width: 240
  height: 135
